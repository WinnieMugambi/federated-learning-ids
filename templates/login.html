<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield FL-IDS: Secure Access Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Glass Stylesheet -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        
        body {
            background-color: #050811;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 210, 255, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(177, 0, 255, 0.05) 0px, transparent 50%);
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(14, 22, 45, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            max-width: 420px;
            width: 100%;
        }

        .logo-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #00d2ff, #b100ff);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin: 0 auto 12px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .logo-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .logo-header span {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .form-label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .form-control {
            background-color: rgba(5, 8, 17, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f8fafc !important;
            padding: 10px 12px;
            font-family: inherit;
        }

        .form-control:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
            outline: none;
        }

        .btn-submit {
            background: linear-gradient(135deg, #00d2ff, #007bff);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            padding: 12px;
            width: 100%;
            margin-top: 1rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.15);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.3);
        }

        .alert {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid rgba(255, 0, 85, 0.2);
            color: #ff0055;
            font-size: 0.85rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-header">
            <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h2>CyberShield FL-IDS</h2>
            <span>Secure Gate Authentication</span>
        </div>

        <!-- Render Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} mb-3" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-light-subtle text-secondary" style="border-color: rgba(255, 255, 255, 0.08);"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Enter username" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-light-subtle text-secondary" style="border-color: rgba(255, 255, 255, 0.08);"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Access Dashboard
            </button>
        </form>
    </div>

</body>
</html>
