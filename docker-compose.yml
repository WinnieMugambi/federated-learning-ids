version: '3.8'

services:
  cybershield-ids:
    build: .
    container_name: cybershield_flask_flower_ids
    ports:
      - "8080:8080"  # Flask Web Interface & REST API
      - "5040:5040"  # Flower Federated gRPC Channel
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
